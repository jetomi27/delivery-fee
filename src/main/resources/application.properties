spring.application.name=delivery-fee

spring.datasource.url=jdbc:h2:file:./data/delivery-fee
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true

weather.api.url=https://www.ilmateenistus.ee/ilma_andmed/xml/observations.php
weather.import.cron=0 15 * * * *
weather.import.on-startup=true

# Missing boolean fields in request JSON become false instead of failing (Jackson 3 fails by default)
spring.jackson.deserialization.fail-on-null-for-primitives=false